api_decisions:
  - topic: assembly_architecture
    status: active
    adr: Docs/architecture/adr-0001-layered-assembly-architecture.md
    choice: "5 layered asmdefs: Contracts, Foundation, Core, Features, Presentation"
    added: "2026-10-21"
  - topic: composition_root
    status: active
    adr: Docs/architecture/adr-0002-bootstrap-composition-root.md
    choice: "Pure C# Composition Root via IBootStep phased lifecycle in BootstrapController"
    added: "2026-10-21"
  - topic: object_pooling
    status: active
    adr: Docs/architecture/adr-0003-zero-allocation-object-pooling.md
    choice: "Central zero-allocation ObjectPoolService with prewarming, Fixed and RecycleOldest policies"
    added: "2026-10-21"
  - topic: audio_engine
    status: active
    adr: Docs/architecture/adr-0004-priority-voice-management.md
    choice: "Lightweight 16-voice pool with priority stealing and software gain bus hierarchy"
    added: "2026-10-21"
  - topic: economy_pipeline
    status: active
    adr: Docs/architecture/adr-0005-layered-income-pipeline.md
    choice: "Layered IncomePipeline with double-precision IEEE 754 floats"
    added: "2026-10-21"
  - topic: plinko_rendering
    status: active
    adr: Docs/architecture/adr-0006-world-space-plinko-physics.md
    choice: "2D Box2D physics simulation rendered in dedicated World Space camera separated from Canvas UI"
    added: "2026-10-21"
  - topic: feedback_pipeline
    status: active
    adr: Docs/architecture/adr-0007-event-driven-feedback-pipeline.md
    choice: "Event-driven presentation translator using DOTween and pooled floating text"
    added: "2026-10-21"
  - topic: gacha_rng
    status: active
    adr: Docs/architecture/adr-0008-weighted-random-drop-selection.md
    choice: "Two-tier CDF cumulative weight binary search using IRandomProvider"
    added: "2026-10-21"
  - topic: data_validation
    status: active
    adr: Docs/architecture/adr-0009-scriptableobject-editor-validation.md
    choice: "Editor-time automated validation via IValidatableAsset and IPreprocessBuildWithReport"
    added: "2026-10-21"

forbidden_patterns:
  - pattern: circular_assembly_dependency
    status: active
    adr: Docs/architecture/adr-0001-layered-assembly-architecture.md
    rule: "Modules must never reference higher layers; Core must not reference Features or Presentation."
    added: "2026-10-21"
  - pattern: monolithic_runtime_assembly
    status: active
    adr: Docs/architecture/adr-0001-layered-assembly-architecture.md
    rule: "Domain logic must not reside in a single unlayered assembly or Assembly-CSharp."
    added: "2026-10-21"
  - pattern: global_singletons_or_findobjectoftype
    status: active
    adr: Docs/architecture/adr-0002-bootstrap-composition-root.md
    rule: "Classes must never use FindObjectOfType or static instance singletons for service location."
    added: "2026-10-21"
  - pattern: runtime_instantiate_destroy
    status: active
    adr: Docs/architecture/adr-0003-zero-allocation-object-pooling.md
    rule: "Programmers must never call Instantiate or Destroy at runtime outside the Prewarm boot phase."
    added: "2026-10-21"
  - pattern: direct_audiosource_instantiation
    status: active
    adr: Docs/architecture/adr-0004-priority-voice-management.md
    rule: "Subsystems must never instantiate AudioSource components directly in prefabs; all sound must route through IAudioService."
    added: "2026-10-21"
  - pattern: canvas_physics_coupling
    status: active
    adr: Docs/architecture/adr-0006-world-space-plinko-physics.md
    rule: "Programmers must never parent moving Rigidbody2D or Collider2D components under a Canvas hierarchy."
    added: "2026-10-21"
  - pattern: presentation_code_in_gameplay
    status: active
    adr: Docs/architecture/adr-0007-event-driven-feedback-pipeline.md
    rule: "Core gameplay and economy code must never reference DOTween, TextMeshPro, or ParticleSystem directly."
    added: "2026-10-21"
  - pattern: unity_random_in_gacha
    status: active
    adr: Docs/architecture/adr-0008-weighted-random-drop-selection.md
    rule: "Gacha resolution must never call UnityEngine.Random directly; must use IRandomProvider."
    added: "2026-10-21"
  - pattern: runtime_asset_mutation_in_validation
    status: active
    adr: Docs/architecture/adr-0009-scriptableobject-editor-validation.md
    rule: "Asset validation must never mutate asset state or serialized fields."
    added: "2026-10-21"
