formulas:
  - name: raw_payout
    source: Docs/design/gdd/plinko-board.md
    variables: [base_coin_value, bucket_multipliers]
    output: "1-5 × base_coin_value per coin"
    referenced_by:
      - Docs/design/gdd/economy-core.md
  - name: effective_bounciness
    source: Docs/design/gdd/plinko-board.md
    variables: [base_peg_bounciness, bounciness_modifier, bounciness_cap]
    output: "0.5-0.85, always < 1.0"
    referenced_by:
      - Docs/design/gdd/pet-catalog.md
  - name: tap_admitted
    source: Docs/design/gdd/plinko-board.md
    variables: [tap_cooldown, max_active_coins, active_coins_after_queue_spawn]
    output: "bool; <= 1/tap_cooldown admitted taps per second"
    referenced_by:
      - Docs/design/gdd/bootstrap-and-scene-flow.md
  - name: auto_drop_interval
    source: Docs/design/gdd/plinko-board.md
    variables: [auto_drop_base_interval, auto_rate_multiplier, auto_drop_min_interval]
    output: ">= auto_drop_min_interval (0.4 s), không có trần trên; dừng khi tổng tốc độ = 0"
    referenced_by:
      - Docs/design/gdd/pet-catalog.md
  - name: coin_rate_ceiling
    source: Docs/design/gdd/plinko-board.md
    variables: [tap_cooldown, auto_drop_rate, auto_drop_min_interval, max_active_coins, median_fall_time]
    output: "trần MỀM theo cấu hình (quyết định user (a), decision-log 2026-10-21): min(1/tap_cooldown + auto_drop_rate, max_active_coins/median_fall_time) xu sơ cấp/s; 6.67 khi không auto-drop, ≈ 9.17 khi auto-drop ở sàn; Overflow (Bùng Xu/Mưa Xu tràn hàng đợi) trả ngay nên thu nhập có thể vượt sức chứa bàn"
    referenced_by:
      - Docs/design/gdd/economy-core.md
      - Docs/design/gdd/audio.md
  - name: raw_rate_ceiling
    source: Docs/design/gdd/plinko-board.md
    variables: [coin_rate_ceiling, ev_effective_mean, effective_bounciness, base_coin_value]
    output: "trần mềm theo cấu hình (cận trên mô hình, không phải trần cứng): ~20 × base_coin_value raw coins/s (base bounciness, no auto-drop); ~27.1 (auto-drop at floor); ~26 to <= 30.7 (bounciness at cap); <= ~42 (both)"
    referenced_by:
      - Docs/design/gdd/economy-core.md
      - Docs/design/gdd/pet-catalog.md
  - name: bucket_probability_and_ev
    source: Docs/design/gdd/plinko-board.md
    variables: [pegs_per_row, bucket_width_weights, bucket_multipliers, sigma, jackpot_burst_count]
    output: "design model, verified by simulation: p_jackpot mean 10-13% (~10.9%), EV_mean 1.85-2.05 (~1.919), EV_effective_mean ~2.96, aim_ratio <= 1.20; at bounciness_cap p_jackpot mean <= 20%, EV_mean <= 2.3"
    referenced_by:
      - Docs/design/gdd/economy-core.md
      - Docs/design/gdd/pet-catalog.md
  - name: base_coin_value
    source: Docs/design/gdd/economy-core.md
